<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 - Welcome Page Greeting</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1 id="greeting">Hello!</h1>
    <nav>
      <button id="changeBtn">Change Greeting</button>
      <button id="toggleBtn">Toggle Welcome Message</button>
    </nav>
  </header>

  <main>
    <section id="welcomeMessage">
      <h2>Welcome to our website</h2>
      <p>We are glad to have you here. Click the greeting above to see it in an alert.</p>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="q1_welcome_greeting.js"></script>
</body>
</html>
